[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pneu"
version = "1.3.2"
description = "Durable local maildir coordination for coding agents"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [
  { name = "Roundtable contributors" },
]
dependencies = [
  "PyYAML>=6.0,<7",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
roundtable-smoke = "pneu_packaging.smoke:main"
roundtable-setup = "pneu_packaging.setup:main"
roundtable-uninstall = "pneu_packaging.cli:uninstall_main"

[tool.setuptools]
include-package-data = false
packages = ["pneu_packaging"]
py-modules = ["_rtcodex", "_rtlauncher", "_rtlib", "_rtmigrate", "_rtrchost", "_rtruntime"]
script-files = [
  "bin/_rtcodex.py",
  "bin/_rtlauncher.py",
  "bin/_rtlib.py",
  "bin/_rtmigrate.py",
  "bin/_rtrchost.py",
  "bin/_rtruntime.py",
  "bin/pneu",
  "bin/roundtable",
  "bin/roundtable-init",
  "bin/rt-ack",
  "bin/rt-claude",
  "bin/rt-codex",
  "bin/rt-codex-daemon",
  "bin/rt-codex-session-start",
  "bin/rt-codex-wake",
  "bin/rt-doctor",
  "bin/rt-hermes",
  "bin/rt-inbox",
  "bin/rt-openclaw",
  "bin/rt-openclaw-wake",
  "bin/rt-grok",
  "bin/rt-grok-wake",
  "bin/rt-projects",
  "bin/rt-rc-host",
  "bin/rt-refresh",
  "bin/rt-resolve",
  "bin/rt-say",
  "bin/rt-startup-advisory",
  "bin/rt-stop-gate",
  "bin/rt-wait-inbox",
  "bin/rt-worktree",
]
package-dir = { "" = "bin", "pneu_packaging" = "pneu_packaging" }

[tool.setuptools.data-files]
"share/pneu" = ["LICENSE", "NOTICE"]
"share/pneu/docs" = [
  "docs/architecture.md",
  "docs/compatibility.md",
  "docs/install.md",
  "docs/legacy-v1-keyboard.md",
  "docs/release.md",
  "docs/wp21-quiet-ack-nudge-retirement.md",
]
"share/pneu/integrations/hermes/pneu" = [
  "integrations/hermes/pneu/__init__.py",
  "integrations/hermes/pneu/plugin.yaml",
]
"share/pneu/integrations/openclaw/roundtable" = [
  "integrations/openclaw/roundtable/__init__.py",
]
"share/pneu/integrations/grok/roundtable" = [
  "integrations/grok/roundtable/__init__.py",
]
"share/pneu/skills/shared/pneu" = [
  "skills/shared/pneu/SKILL.md",
]
"share/pneu/templates" = [
  "templates/AGENTS.md.tmpl",
  "templates/BRIEF.md.tmpl",
  "templates/CLAUDE.md.tmpl",
  "templates/HERMES.md.tmpl",
  "templates/README.md.tmpl",
  "templates/ROUTING.md.tmpl",
  "templates/agents.yaml.tmpl",
  "templates/decision.md.tmpl",
  "templates/root-gitignore.tmpl",
  "templates/roundtable-gitignore.tmpl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: opt-in live harness or Gateway integration test",
]
